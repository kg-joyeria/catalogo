<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>KG JOYERIA | Oro y plata</title>
<meta name="description" content="Catálogo de joyería en oro y plata. Pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--ink:#141414;--white:#fff;--paper:#f6f6f5;
  --silver:#c4c7cc;--silver-d:#8b9097;--line:#e4e4e2;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overscroll-behavior-y:none}
body{background:#d9d9d7;font-family:var(--sans);color:var(--ink)}
.app{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;box-shadow:0 0 30px rgba(0,0,0,.15)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--silver-d);outline-offset:2px}

/* Header */
.hd{position:sticky;top:0;z-index:30;background:var(--black);display:flex;justify-content:center;align-items:center;padding:2px 20px;transition:padding .25s,box-shadow .25s;border-bottom:1px solid #2a2a2a}
.hd img{height:136px;width:auto;max-width:90%;object-fit:contain;transition:height .25s}
.hd.sm{padding:2px 20px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.hd.sm img{height:76px}
.logo-inv{filter:brightness(0) invert(1)} /* activa con LOGO_INVERT si tu logo es oscuro */

/* Hero */
.hero{position:relative;background:var(--black);color:var(--white);overflow:hidden}
.hero-track{display:flex;transition:transform .5s ease}
.slide{min-width:100%;position:relative}
.slide .ph{aspect-ratio:4/4.3;background:#111}
.slide .ph img{width:100%;height:100%;object-fit:cover}
.slide .ov{position:absolute;inset:auto 0 0 0;padding:70px 22px 46px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.slide h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;margin-bottom:6px}
.slide .pr{font-size:20px;color:var(--silver);margin-bottom:14px;font-weight:500}
.btn{display:inline-block;padding:12px 26px;font-size:14px;font-weight:600;letter-spacing:.04em;border-radius:2px}
.btn-w{background:var(--white);color:var(--black)}
.btn-k{background:var(--black);color:var(--white)}
.btn-o{border:1px solid var(--black);color:var(--black)}
.arr{position:absolute;top:42%;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;z-index:2}
.arr svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.arr.l{left:10px}.arr.r{right:10px}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s}
.dots i.on{background:var(--white);width:22px;border-radius:4px}

/* Categorías */
.cats{display:flex;gap:8px;overflow-x:auto;padding:18px 16px 6px;scrollbar-width:none;background:var(--white)}
.cats::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 18px;border:1px solid var(--silver);border-radius:999px;font-size:14px;font-weight:500;background:var(--white);transition:.15s}
.pill.on{background:var(--black);color:var(--white);border-color:var(--black)}

/* Grid */
.sec-t{font-family:var(--serif);font-size:26px;font-weight:600;padding:18px 16px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:12px 16px 30px}
.card{position:relative}
.card .im{position:relative;aspect-ratio:1/1.1;background:var(--paper);overflow:hidden;border-radius:2px;width:100%}
.card .im img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--black);color:var(--white);font-size:12px;font-weight:600;padding:4px 8px;border-radius:2px}
.cart{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--black);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cart svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8}
.card h3{font-size:15px;font-weight:500;margin:9px 0 3px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .p{font-weight:600;font-size:16px}
.card .old{color:var(--silver-d);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.msg{padding:50px 24px;text-align:center;color:var(--silver-d);grid-column:1/-1}

/* Popup */
.mo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.sheet{width:100%;max-width:480px;overflow:hidden;background:var(--white);border-radius:14px 14px 0 0;animation:up .28s ease}
.sc{max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.close{position:absolute;top:10px;right:10px;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.75);display:grid;place-items:center}
.close svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2;fill:none}
.sl{position:relative}
.sl-t{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--paper)}
.sl-t::-webkit-scrollbar{display:none}
.sl-t img{min-width:100%;width:100%;height:auto;min-height:280px;max-height:75vh;max-height:75dvh;scroll-snap-align:center;object-fit:contain}
.from{font-size:.7em;font-weight:400;opacity:.75;margin-right:2px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-height:40px;padding:8px 16px;border:1px solid #555;border-radius:999px;background:transparent;color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
.sz.on{background:#fff;color:#000;border-color:#fff}
.sl .dots{bottom:12px}
.sl .dots i{background:rgba(0,0,0,.25)}.sl .dots i.on{background:var(--black)}
.info{padding:18px 20px 26px}
.info h2{font-family:var(--serif);font-size:30px;line-height:1.05;font-weight:600}
.info .pr{font-size:22px;font-weight:600;margin:8px 0 14px}
.info h4{font-size:13px;font-weight:600;color:var(--silver-d);margin:16px 0 6px}
.info p{font-size:15px;line-height:1.55;white-space:pre-line}
.info ul{list-style:none}
.info li{font-size:15px;line-height:1.5;padding:6px 0 6px 20px;position:relative;border-bottom:1px solid var(--line)}
.info li::before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;background:var(--silver);transform:rotate(45deg)}
.acts{display:flex;gap:10px;margin-top:22px}
.acts .btn{flex:1;text-align:center;padding:14px 10px;font-size:15px;display:flex;justify-content:center;align-items:center;gap:8px}
.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}

/* Footer */
.ft{background:var(--black);color:var(--white);padding:34px 22px 20px;text-align:center;margin-top:auto}
.ft img{height:120px;margin:0 auto 24px;object-fit:contain}
.ben{display:flex;gap:14px;text-align:left;padding:14px 0;border-top:1px solid #2c2c2c;align-items:flex-start}
.ben svg{flex:none;width:28px;height:28px;stroke:var(--silver);fill:none;stroke-width:1.5}
.ben b{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.ben span{font-size:13.5px;color:#b5b8bd;line-height:1.45}
.copy{font-size:12px;color:#7d8187;margin-top:20px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%)}
/* Tema oscuro: fondo negro, letras blancas */
body{background:#000;color:#fff}
.app{background:#000;color:#fff;box-shadow:0 0 30px rgba(255,255,255,.06)}
.cats{background:#000}
.pill{background:transparent;color:#fff;border-color:#4a4d52}
.pill.on{background:#fff;color:#000;border-color:#fff}
.card .im{background:#111}
.badge{background:#fff;color:#000}
.cart{background:#fff}
.cart svg{stroke:#000}
.btn-k{background:#fff;color:#000}
.sheet{background:#000;color:#fff;border-top:1px solid #2a2a2a}
.close{border:1px solid rgba(255,255,255,.3)}
.sl-t{background:#000}
.sl .dots i{background:rgba(255,255,255,.4)}
.sl .dots i.on{background:#fff}
.info li{border-bottom-color:#2a2a2a}
.ft{border-top:1px solid #2a2a2a}
.toast{background:#fff;color:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app"><header class="hd" id="hd"><img id="logoH" alt="KG JOYERIA" /></header>
<section class="hero" id="hero" aria-label="Piezas destacadas" hidden="">
<div class="hero-track" id="heroT"></div>
<button class="arr l" id="hp" aria-label="Anterior"><svg viewbox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></button> <button class="arr r" id="hn" aria-label="Siguiente"><svg viewbox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg></button>
<div class="dots" id="heroD"></div>
</section>
<nav class="cats" id="cats" aria-label="Categorías"></nav>
<h2 class="sec-t" id="secT">Catálogo</h2>
<main class="grid" id="grid">
<div class="msg">Cargando joyas…</div>
</main><footer class="ft"><img id="logoF" alt="KG JOYERIA" />
<div class="ben"><svg viewbox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5L16 9.5"></path></svg>
<div><b>Oro y plata garantizados</b><span>Piezas de calidad certificada, con el peso y la ley que ves en la descripción.</span></div>
</div>
<div class="ben"><svg viewbox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg>
<div><b>Envíos seguros</b><span>Tu joya sale protegida y bien empacada hasta tu puerta.</span></div>
</div>
<div class="ben"><svg viewbox="0 0 24 24"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 19z"></path><path d="M9 10c0 3 2 5 5 5l1.2-1.4-2-1-1 .8c-1-.5-1.8-1.3-2.2-2.2l.8-1-1-2z"></path></svg>
<div><b>Atención por WhatsApp</b><span>Te asesoramos antes y después de tu compra, sin bots.</span></div>
</div>
<p class="copy">© <span id="yr"></span> KG JOYERIA</p>
</footer></div>
<div class="mo" id="mo" role="dialog" aria-modal="true" aria-label="Detalle del producto">
<div class="sheet" id="sheet" style="position: relative;"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===== CONFIGURACIÓN ===== */
const API_URL   = 'https://script.google.com/macros/s/AKfycbwnZeYVA3BUHCh7HnCdHrC7b8F78_Zes8ZKF0F1xIuxNgRl3XwmKh6_ghWW3yXAp5i_/exec';          // URL de la Web App (termina en /exec)
const WHATSAPP  = '526625133763';                    // con código de país, sin + ni espacios
const LOGO      = 'https://i.ibb.co/cSWNtWvk/IMG-4273.png';
const LOGO_INVERT = false;                           // true = vuelve blanco un logo oscuro/negro
const DISCOUNT_CHANCE = 0.3;                         // % de productos con badge decorativo (0 a 1). 0 = sin badges

/* ===== UTILIDADES ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isNaN(n) ? null : n; };
const money = v => { const n = num(v); return n === null ? String(v ?? '') : '$' + n.toLocaleString('es-MX'); };
const parseSizes = p => String(p.medidas || p.tallas || '').split(/;|\n|,(?!\d{3}(?!\d))/).map(x => x.trim()).filter(Boolean).map(x => {
  const i = x.lastIndexOf(':'); return i > 0 ? { l: x.slice(0,i).trim(), pr: x.slice(i+1).trim() } : { l: x, pr: null };
});
const fromPrice = p => {
  const ps = parseSizes(p).map(z => num(z.pr)).filter(n => n !== null); if (!ps.length) return null;
  const min = Math.min(...ps), base = num(p.precio);
  return (base === null ? min < Math.max(...ps) : min < base) ? min : null;
};
const priceTxt = p => { const f = fromPrice(p); return f === null ? money(p.precio) : `<span class="from">Desde</span> ${money(f)}`; };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const toast = t => { const el=$('#toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2200); };
const IC_CLOSE='<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>';
const IC_CART='<svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h9.6L19.5 7H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>';
const IC_WA='<svg viewBox="0 0 24 24"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 19z"/></svg>';
const IC_SH='<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>';

let productos = [], byId = {}, cat = 'Todos';

/* ===== INICIO ===== */
['#logoH','#logoF'].forEach(s => { const i=$(s); i.src=LOGO; if(LOGO_INVERT) i.classList.add('logo-inv'); });
$('#yr').textContent = new Date().getFullYear();
addEventListener('scroll', () => $('#hd').classList.toggle('sm', scrollY > 30), {passive:true});

fetch(API_URL).then(r => r.json()).then(d => {
  if (!d.ok) throw new Error(d.error);
  productos = d.productos.map(p => {
    const n = num(p.precio);
    p.desc = (n !== null && Math.random() < DISCOUNT_CHANCE) ? [10,15,20,25,30][Math.floor(Math.random()*5)] : 0;
    p.tachado = p.desc ? Math.round(n / (1 - p.desc/100) / 10) * 10 : null;
    if (fromPrice(p) !== null) { p.desc = 0; p.tachado = null; }
    return p;
  });
  productos.forEach(p => byId[p.id] = p);
  buildHero(); buildCats(); buildGrid();
  const id = new URLSearchParams(location.search).get('id');
  if (id && byId[id]) openProduct(id);
}).catch(() => { $('#grid').innerHTML = '<div class="msg">No pudimos cargar el catálogo. Revisa tu conexión y vuelve a intentar.</div>'; });

/* ===== HERO ===== */
let hi = 0, hn = 0, ht;
function buildHero() {
  const picks = shuffle(productos.filter(p => p.fotos.length)).slice(0,3);
  if (!picks.length) return;
  hn = picks.length;
  $('#heroT').innerHTML = picks.map(p => `
    <div class="slide"><div class="ph"><img src="${esc(p.fotos[0])}" alt="${esc(p.producto)}"></div>
    <div class="ov"><h2>${esc(p.producto)}</h2><div class="pr">${priceTxt(p)}</div>
    <button class="btn btn-w" data-open="${esc(p.id)}">Ver pieza</button></div></div>`).join('');
  $('#heroD').innerHTML = picks.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  $('#hero').hidden = false;
  const go = i => { hi=(i+hn)%hn; $('#heroT').style.transform=`translateX(-${hi*100}%)`; [...$('#heroD').children].forEach((d,k)=>d.classList.toggle('on',k===hi)); };
  $('#hp').onclick = () => { go(hi-1); auto(); };
  $('#hn').onclick = () => { go(hi+1); auto(); };
  const auto = () => { clearInterval(ht); ht = setInterval(()=>go(hi+1), 5500); };
  let sx = 0;
  $('#hero').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  $('#hero').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { go(hi + (dx<0?1:-1)); auto(); } });
  auto();
}

/* ===== CATEGORÍAS ===== */
function buildCats() {
  const cs = ['Todos', ...new Set(productos.map(p => p.categoria).filter(Boolean))];
  $('#cats').innerHTML = cs.map(c => `<button class="pill ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  cat = b.dataset.cat; buildCats(); buildGrid();
  $('#secT').textContent = cat === 'Todos' ? 'Catálogo' : cat;
});

/* ===== GRID ===== */
function buildGrid() {
  const list = productos.filter(p => cat === 'Todos' || p.categoria === cat);
  if (!list.length) { $('#grid').innerHTML = '<div class="msg">Aún no hay piezas en esta categoría.</div>'; return; }
  $('#grid').innerHTML = list.map(p => `
    <article class="card">
      <div class="im" data-open="${esc(p.id)}" role="button" tabindex="0" aria-label="Ver ${esc(p.producto)}">
        <img src="${esc(p.fotos[0] || '')}" alt="${esc(p.producto)}" loading="lazy">
        ${p.desc ? `<span class="badge">-${p.desc}%</span>` : ''}
        <button class="cart" data-open="${esc(p.id)}" aria-label="Ver detalle">${IC_CART}</button>
      </div>
      <h3>${esc(p.producto)}</h3>
      <div><span class="p">${priceTxt(p)}</span>${p.tachado ? `<span class="old">${money(p.tachado)}</span>` : ''}</div>
    </article>`).join('');
}
document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) { e.stopPropagation(); openProduct(o.dataset.open); } });
$('#grid').addEventListener('keydown', e => { if (e.key === 'Enter') { const o = e.target.closest('[data-open]'); if (o) openProduct(o.dataset.open); } });

/* ===== POPUP ===== */
function openProduct(id) {
  const p = byId[id]; if (!p) return;
  const feats = p.caracteristicas.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const fotos = p.fotos.length ? p.fotos : [''];
  const sizes = parseSizes(p);
  let sel = null;
  $('#sheet').innerHTML = `
    <button class="close" id="cl" aria-label="Cerrar">${IC_CLOSE}</button>
    <div class="sc" id="sc">
    <div class="sl"><div class="sl-t" id="slT">${fotos.map(f=>`<img src="${esc(f)}" alt="${esc(p.producto)}">`).join('')}</div>
      ${fotos.length>1 ? `<div class="dots" id="slD">${fotos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}</div>
    <div class="info">
      <h2>${esc(p.producto)}</h2>
      <div class="pr" id="prc">${priceTxt(p)}${p.tachado ? `<span class="old" style="font-size:15px;margin-left:8px;color:var(--silver-d);text-decoration:line-through;font-weight:400">${money(p.tachado)}</span>`:''}</div>
      ${sizes.length ? `<h4>Medida</h4><div class="sizes" id="sz">${sizes.map((z,i)=>`<button class="sz" data-i="${i}">${esc(z.l)}</button>`).join('')}</div>`:''}
      ${p.descripcion ? `<h4>Descripción</h4><p>${esc(p.descripcion)}</p>`:''}
      ${feats.length ? `<h4>Características</h4><ul>${feats.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
      <div class="acts">
        <button class="btn btn-k" id="buy">${IC_WA}Comprar</button>
      </div>
    </div>
    </div>`;
  $('#mo').classList.add('open'); document.body.style.overflow = 'hidden';
  $('#sc').scrollTop = 0;
  const t = $('#slT'), d = $('#slD');
  if (d) t.addEventListener('scroll', () => { const k = Math.round(t.scrollLeft / t.clientWidth); [...d.children].forEach((x,i)=>x.classList.toggle('on',i===k)); }, {passive:true});
  $('#cl').onclick = closeP;
  if (sizes.length) $('#sz').addEventListener('click', e => {
    const b = e.target.closest('.sz'); if (!b) return;
    sel = sizes[+b.dataset.i];
    [...$('#sz').children].forEach(x => x.classList.toggle('on', x === b));
    $('#prc').textContent = money(sel.pr || p.precio);
  });
  const link = `${location.origin}${location.pathname}?id=${encodeURIComponent(p.id)}`;
  $('#buy').onclick = () => {
    if (sizes.length && !sel) { toast('Elige una medida'); return; }
    const m = `Hola, me interesa esta pieza de KG JOYERIA:\n*${p.producto}*\n${sel ? `Medida: ${sel.l}\n` : ''}Precio: ${money(sel && sel.pr ? sel.pr : p.precio)}\n${link}`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`, '_blank');
